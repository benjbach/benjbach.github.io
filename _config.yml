title: Benjamin Bach
description: >-

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://benjbach.net" # the base hostname & protocol for your site, e.g. http://example.com
theme: jekyll-theme-minimal
repository: benjbach/benjbach.github.io
github: [metadata]
relative_links:
  enabled: true
  collections: true
page_excerpts: true
plugins:
  - jekyll-seo-tag
  - jekyll-default-layout
  - jekyll-optional-front-matter
  - jekyll-paginate
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-resize
collections:
  projects:
    output: true
    order:
      - dashboards.md
      - tools.md
      - education.md
      - networks.md
      - covid19_vis.md
      - data_comics.md
      - geographic.md
      - immersive_analytics.md
      - peace_analytics.md
      - clinical_guidelines.md
  vishubprojects:
    output: true
    order:
      - mailinglist.md
      - professionals_course.md
      - datafairs.md
      - datavismeetup.md
      - chartclinic.md
